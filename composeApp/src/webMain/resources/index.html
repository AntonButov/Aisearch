<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ИИ поиск</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap&subset=latin,cyrillic" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            user-select: text;
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
        }
        #ComposeTarget {
            width: 100vw;
            /* 100dvh = dynamic viewport height (excludes browser UI); 100vh fallback for older browsers */
            height: 100vh;
            height: 100dvh;
            min-height: 100vh;
            min-height: 100dvh;
            padding-bottom: env(safe-area-inset-bottom, 0px);
            user-select: text;
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
        }
    </style>
    <script type="importmap">
    {
        "imports": {
            "@js-joda/core": "https://cdn.jsdelivr.net/npm/@js-joda/core@3.2.0/dist/js-joda.esm.js"
        }
    }
    </script>
    <script>
        // Подавление WebGL предупреждений от Skiko
        (function() {
            const originalWarn = console.warn;
            const originalError = console.error;
            
            console.warn = function(...args) {
                const message = args.join(' ');
                // Фильтруем WebGL предупреждения от Skiko
                if (message.includes('WEBGL_debug_renderer_info') || 
                    message.includes('INVALID_ENUM') && message.includes('getParameter')) {
                    return;
                }
                originalWarn.apply(console, args);
            };
            
            console.error = function(...args) {
                const message = args.join(' ');
                // Фильтруем WebGL ошибки от Skiko
                if (message.includes('WEBGL_debug_renderer_info') || 
                    (message.includes('INVALID_ENUM') && message.includes('getParameter'))) {
                    return;
                }
                originalError.apply(console, args);
            };
        })();

        // Sync container height with visualViewport (address bar, keyboard) for mobile browsers
        (function() {
            function updateViewportHeight() {
                const vv = window.visualViewport;
                const container = document.getElementById('ComposeTarget');
                if (vv && container) {
                    container.style.height = vv.height + 'px';
                    container.style.minHeight = vv.height + 'px';
                }
            }
            function init() {
                if (window.visualViewport) {
                    window.visualViewport.addEventListener('resize', updateViewportHeight);
                    window.visualViewport.addEventListener('scroll', updateViewportHeight);
                    updateViewportHeight();
                }
            }
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</head>
<body>
    <div id="ComposeTarget"></div>
    <script type="module" src="Aisearch-composeApp.mjs"></script>
</body>
</html>
