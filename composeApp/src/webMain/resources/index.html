<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ИИ поиск</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            overflow: hidden;
            user-select: text;
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
        }
        #ComposeTarget {
            width: 100vw;
            height: 100vh;
            user-select: text;
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
        }
    </style>
    <script type="importmap">
    {
        "imports": {
            "@js-joda/core": "https://cdn.jsdelivr.net/npm/@js-joda/core@3.2.0/dist/js-joda.esm.js"
        }
    }
    </script>
    <script>
        // Подавление WebGL предупреждений от Skiko
        (function() {
            const originalWarn = console.warn;
            const originalError = console.error;
            
            console.warn = function(...args) {
                const message = args.join(' ');
                // Фильтруем WebGL предупреждения от Skiko
                if (message.includes('WEBGL_debug_renderer_info') || 
                    message.includes('INVALID_ENUM') && message.includes('getParameter')) {
                    return;
                }
                originalWarn.apply(console, args);
            };
            
            console.error = function(...args) {
                const message = args.join(' ');
                // Фильтруем WebGL ошибки от Skiko
                if (message.includes('WEBGL_debug_renderer_info') || 
                    (message.includes('INVALID_ENUM') && message.includes('getParameter'))) {
                    return;
                }
                originalError.apply(console, args);
            };
        })();
    </script>
</head>
<body>
    <div id="ComposeTarget"></div>
    <script type="module" src="Aisearch-composeApp.mjs"></script>
</body>
</html>
